# VoiceNote configuration. Edit this file to swap models; no code changes needed.

[audio]
sample_rate = 16000          # Whisper's native rate; recordings are mono 16-bit WAV
input_device = "Lorro Microphone"            # name substring or index (see `python -m voicenote devices`); empty = system default

[storage]
data_dir = "data"            # recordings, transcripts, summaries live here (git-ignored)

[transcription]
backend = "mlx-whisper"      # see voicenote/transcription/__init__.py for available backends
# Hugging Face repo ID (downloaded once, then cached in ~/.cache/huggingface).
# Try: whisper-tiny-mlx, whisper-base-mlx, whisper-small-mlx, whisper-medium-mlx,
#      whisper-large-v3-turbo
model = "mlx-community/whisper-base-mlx"
language = ""                # e.g. "en"; empty = auto-detect
